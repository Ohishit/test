<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整数基本运算器</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f9; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        h2 { margin-top: 0; color: #333; }
        input { width: calc(100% - 24px); padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px; border: none; border-radius: 5px; background-color: #007bff; color: white; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        #result { font-size: 20px; font-weight: bold; color: #d9534f; word-break: break-all; }
    </style>
</head>
<body>
    <div class="box">
        <h2>整数计算器</h2>
        <input type="number" id="num1" placeholder="请输入第一个整数 (如 10)">
        <input type="number" id="num2" placeholder="请输入第二个整数 (如 5)">
        <div class="btns">
            <button onclick="calc('+')">加法 +</button>
            <button onclick="calc('-')">减法 -</button>
            <button onclick="calc('*')">乘法 ×</button>
            <button onclick="calc('/')">除法 ÷</button>
        </div>
        <div id="result">等待计算...</div>
    </div>

    <script>
        function calc(operator) {
            let n1 = document.getElementById('num1').value;
            let n2 = document.getElementById('num2').value;
            let resBox = document.getElementById('result');

            // 检查是否为空
            if (n1 === '' || n2 === '') {
                resBox.innerText = '错误：请完整输入两个数字！';
                return;
            }

            let a = Number(n1);
            let b = Number(n2);
            let result = 0;

            // 执行运算
            if (operator === '+') result = a + b;
            else if (operator === '-') result = a - b;
            else if (operator === '*') result = a * b;
            else if (operator === '/') {
                if (b === 0) {
                    resBox.innerText = '错误：除数不能为 0！';
                    return;
                }
                result = a / b;
            }

            resBox.innerText = '计算结果：' + result;
        }
    </script>
</body>
</html>
